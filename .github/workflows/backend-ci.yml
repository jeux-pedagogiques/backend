name: Backend CI & Security

on:
  push:
    branches: [ "main", "master", "develop", "spring_1" ]
  pull_request:
    branches: [ "main", "master", "develop", "spring_1" ]

jobs:
  backend-ci:
    name: Backend Build, Pytest & Security Scans
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov bandit pip-audit ruff

      - name: Code Quality & Style (Ruff)
        run: ruff check app/ tests/

      - name: Run Backend Unit Tests (Pytest)
        run: pytest tests -v

      - name: SAST Scan — Bandit (Python Security Patterns)
        run: bandit -r app/ -ll

      - name: SCA Scan — pip-audit (CVE Vulnerabilities)
        run: pip-audit --desc on || true

  security-sast:
    name: Security — Gitleaks & CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Gitleaks Standalone Binary
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz
          tar -zxvf gitleaks_8.18.2_linux_x64.tar.gz
          sudo mv gitleaks /usr/local/bin/

      - name: Run Gitleaks Secret Scan
        run: gitleaks detect --verbose --redact --source .

      - name: Initialize CodeQL Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: python
          setup-python-dependencies: false

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
